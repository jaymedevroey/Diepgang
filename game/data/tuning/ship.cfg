; De Ekster en de drop (GDD v3 §3). Snelheden in m/s, versnellingen in m/s², tijden in s.

[values]

; Drop, aftellen in de hub: drop_countdown_s na de hendel; zit iedereen in de Mol (ook later),
; dan nog hooguit drop_countdown_all_in_s. Op drop_ramp_close_s voor het einde gaat de klep dicht
; (laatste oproep, het licht wordt rood), op drop_door_lead_s gaan de luiken open.
drop_countdown_s=8.0
drop_countdown_all_in_s=5.0
drop_ramp_close_s=3.0
drop_door_lead_s=0.9

; Drop, de val: de klemmen duwen de Mol met drop_eject_speed los, hij valt drop_hub_fall_s door
; de luiken van de hub en springt dan naar buiten (lange drop: onder het buitenschip; korte drop,
; vanaf de tweede van een sessie of na overslaan: drop_short_height boven de landingsplek, al op
; volle snelheid). Vrije val tot drop_max_speed, dan remmen met de stuwraketten (drop_brake, nooit
; sneller dan drop_brake_cap) tot drop_touch_speed op drop_touch_height boven de grond. Is het
; terrein onder de landingsplek nog niet geladen, dan blijft de Mol op drop_wait_height hangen.
drop_eject_speed=2.0
drop_hub_fall_s=1.2
drop_short_height=150.0
drop_max_speed=55.0
drop_brake=22.0
drop_brake_cap=18.0
drop_touch_speed=7.0
drop_touch_height=1.5
drop_wait_height=30.0

; Drop, na de landing: zoveel seconden tot de besturing terugkomt (stempel, gereedschap, HUD);
; zo lang klinkt alles gedempt na de klap.
drop_handover_s=0.7
drop_muffle_s=0.9

; Drop, de camera (DropCam). Onder het schip (lange drop): zoveel achter en onder de baai, nooit
; lager kijkend dan drop_cam_min_up_deg (geen horizon). Daarna het volgshot achter (back) en boven
; (up) de Mol, dat drop_cam_pitch_deg naar beneden kijkt: hoog in de lucht (boven 220 m) vlakker
; (high_pitch, high_back, high_up), zodat de kim, de hemel en de landmarken in beeld staan
; (buiten-1); dichter bij de grond steiler, op de landingsplek. Bij het remmen naar brake_back/
; brake_up in drop_cam_brake_blend_s, vooruit over het dak. Beeldhoek van fov tot fov_fast met de
; snelheid; naijlen (m per m/s²) bij versnellen; schok in graden; traag rollen in de vrije val
; (roll_deg) en inhalen (catch: begint zoveel keer verder, haalt in over catch_s).
drop_cam_ship_back=16.0
drop_cam_ship_below=34.0
drop_cam_min_up_deg=42.0
drop_cam_back=12.0
drop_cam_up=9.0
drop_cam_pitch_deg=30.0
drop_cam_brake_back=13.0
drop_cam_brake_up=6.0
drop_cam_brake_blend_s=2.0
drop_cam_fov=70.0
drop_cam_fov_fast=80.0
drop_cam_high_pitch_deg=17.0
drop_cam_high_back=17.0
drop_cam_high_up=6.0
drop_cam_lag=0.22
drop_cam_shake_deg=1.4
drop_cam_roll_deg=2.2
drop_cam_catch=1.45
drop_cam_catch_s=5.0
; Golf 3 (gevoel2-11, buiten2-2): de onthulling. De eerste reveal_s van het volgshot kijkt hij
; reveal_pitch_deg (0 = de horizon in het midden: de reus en zijn ring in het bovenste derde) en tot
; reveal_turn_deg naar de reus toe; daarna kantelt hij in reveal_blend_s naar de landingsplek.
drop_cam_reveal_s=1.6
drop_cam_reveal_blend_s=1.8
drop_cam_reveal_pitch_deg=-2.0
drop_cam_reveal_turn_deg=16.0
; Golf 3: de plannen van de val. Zoveel s na het ontsteken van de stuwraketten een knip naar de flank,
; en onder ground_cut_m boven de grond naar een vaste camera op de grond, ground_dist m van de plek.
drop_cam_flank_after_s=0.15
drop_cam_ground_cut_m=26.0
drop_cam_ground_dist=17.0
; De stoflaag tussen 110 en 210 m waar je doorheen valt (0 = uit): hoe dicht een pluk is.
drop_cloud_alpha=0.32
; Na de klap blijft het buitenbeeld nog zo lang staan (de stofgolf naar de grondcamera, de stoot),
; dan pas de knip naar binnen (golf 3: 0,22 s was te kort om de klap van buiten te zien, gevoel2-12).
drop_cam_land_hold_s=0.9

; Ophalen: de grijper vertrekt al tijdens het aftellen en wacht grapple_wait_m boven het dak op de
; landingsplek; komt de Mol aan, dan zakt hij het laatste stuk (grapple_final_speed) tot op het dak,
; houdt even vast (de klep gaat dicht, een schok) en trekt de Mol dan omhoog tot in de baai.
grapple_down_speed=40.0
grapple_wait_m=14.0
grapple_final_speed=9.0
grapple_hold_s=1.2
lift_speed=36.0
lift_accel=9.0
; Ophalen, de camera (DropCam, LIFT): het kraanshot staat lift_cam_side m opzij van de Mol op de grond
; (golf 3: het stijgt niet meer mee); het laatste plan hangt lift_cam_stop_m onder de baai, zodat de
; Mol in het schip verdwijnt, en wordt zwart als hij erin is.
lift_cam_side=26.0
lift_cam_stop_m=46.0
lift_cam_fov=62.0
; Golf 3 (gevoel2-11, buiten2-3): het ophalen in drie plannen. Het kraanshot op de grond begint al
; bij het zakken van de grijper, kijkt giant_deg naast de reus (de reus naast de Mol, niet erachter)
; en duurt tot crane_s nadat de Mol loskwam; dan naast de Mol omlaag kijkend (de plek valt weg); de
; laatste bay_m onder de baai het schip boven in beeld.
lift_cam_giant_deg=38.0
lift_cam_crane_s=2.8
lift_cam_bay_m=160.0
