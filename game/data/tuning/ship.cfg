; De Ekster en de drop (GDD v3 §3). Snelheden in m/s, versnellingen in m/s², tijden in s.

[values]

; Drop: aftellen na de hendel (de luiken gaan 2,5 s voor het einde open en de klep dicht),
; vrije val tot max. drop_max_speed, dan remmen met de stuwraketten (drop_brake, nooit sneller
; dan drop_brake_cap) tot drop_touch_speed bij het neerkomen. Is het terrein onder de
; landingsplek nog niet geladen, dan blijft de Mol op drop_wait_height boven de grond hangen.
drop_countdown_s=8.0
drop_max_speed=42.0
drop_brake=14.0
drop_brake_cap=15.0
drop_touch_speed=3.0
drop_wait_height=30.0

; Ophalen: de grijper zakt aan zijn kabel tot op het dak, houdt even vast (de klep gaat dicht)
; en trekt de Mol dan omhoog tot in de baai.
grapple_down_speed=40.0
grapple_hold_s=2.0
lift_speed=24.0
lift_accel=6.0
