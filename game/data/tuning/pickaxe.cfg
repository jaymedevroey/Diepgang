; Houweel. Tijden in seconden, afstanden in meter, hoeken in graden.

[values]

; Zwaai: aanzet -> slag -> (hit-stop) -> terugveren. Samen ±0,55 s per slag.
windup_s=0.17
strike_s=0.07
hitstop_s=0.055
recover_s=0.26
; Klik tijdens het terugveren wordt onthouden en start meteen de volgende slag.
buffer_click=true

reach=2.6

; Schilfer die in klei loskomt.
chip_radius=0.75
chip_depth=0.45
chip_roughness=0.14

; Camera bij een inslag in zachte grond, en bij afketsen op te harde rots.
kick_pitch_deg=1.6
kick_yaw_deg=0.6
shake_trauma=0.28
clink_kick_pitch_deg=2.6
clink_shake_trauma=0.42

; Echte steentjes (lokaal, cosmetisch) per slag.
pebbles_min=3
pebbles_max=5
