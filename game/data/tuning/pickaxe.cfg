; Houweel. Tijden in seconden, afstanden in meter, hoeken in graden.

[values]

; Zwaai: aanzet -> slag -> (hit-stop) -> terugveren. Samen ±0,55 s per slag.
windup_s=0.17
strike_s=0.07
hitstop_s=0.055
recover_s=0.26
; Klik tijdens het terugveren wordt onthouden en start meteen de volgende slag.
buffer_click=true
; De slag die een korst breekt: langere hit-stop (het moment, gevoel-03).
break_hitstop_s=0.11
; Wisselen van gereedschap: zo lang komt het van onder in beeld (ook voor de boor).
equip_s=0.28

; Verse snede (binnen-09): de kuil is even donkerder en vochtiger (de laagkleur × fresh_cut_tint, menging;
; golf 3, gevoel-19: in de kleur van de laag, niet meer een vaste grijsbeige die de klei net lichter maakte),
; en droogt op in zoveel seconden.
fresh_cut_tint=0.5
fresh_cut_mix=0.65
fresh_cut_s=25.0

reach=2.6

; Schilfer die in klei loskomt.
chip_radius=0.75
chip_depth=0.45
chip_roughness=0.14

; Camera bij een inslag in zachte grond, en bij afketsen op te harde rots.
kick_pitch_deg=1.6
kick_yaw_deg=0.6
shake_trauma=0.28
clink_kick_pitch_deg=2.6
clink_shake_trauma=0.42

; Echte steentjes (lokaal, cosmetisch) per slag.
pebbles_min=3
pebbles_max=5
