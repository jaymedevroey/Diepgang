; Dragen met de grijphandschoen (GDD §3 en §5).

[values]

; Afstand vanaf het hoofd tot de vondst, en hoe ver je iets kan oppakken.
hold_distance=1.25
grab_reach=3.0

; Gewicht: loopsnelheid = 1 - massa / (draagkracht × aantal dragers), nooit onder min_speed.
; Voorbeelden (1 drager): wervel 3 kg → 0,9; dijbeen 8 kg → 0,73; schedel 14 kg → 0,53.
strength=30.0
min_speed=0.4

; Gooien: snelheid in m/s langs de kijkrichting.
throw_speed=6.5

; Botsschade: boven deze snelheidsverandering (m/s) verliest de vondst gaafheid.
impact_threshold=5.0
impact_damage=0.05
