; Dragen met de grijphandschoen (GDD §3 en §5).

[values]

; Hoe ver je iets kan oppakken (de afstand waarop je hem vasthoudt: zie hold_near hieronder).
grab_reach=3.0

; Gewicht: loopsnelheid = 1 - massa / (draagkracht × aantal dragers), nooit onder min_speed.
; Voorbeelden (1 drager): wervel 3 kg → 0,9; dijbeen 8 kg → 0,73; schedel 14 kg → 0,53.
strength=30.0
min_speed=0.4
; Zwaarder dan dit (kg): niet sprinten.
sprint_max_mass=6.0

; Samen dragen (release-audit ontwerp-8). Zwaarder dan lift_max (kg) til je niet alleen: dan sleep je
; het over de grond aan drag_speed (deel van lopen), drag_near m voor je voeten (plus de straal), en
; het schuurt: drag_wear gaafheid per meter. Met twee is de draagkracht team_strength keer groter
; dan twee keer één (elk een kant): reuzendijbeen 22 kg → 0,73; bekken 26 kg → 0,68; titanschedel
; 34 kg → 0,58. Jullie blijven samen: hooguit 2 × de houdafstand + team_span m uit elkaar.
lift_max=18.0
drag_speed=0.33
drag_near=0.45
drag_wear=0.004
team_strength=1.35
team_span=1.0

; Gooien: snelheid in m/s langs de kijkrichting.
throw_speed=6.5

; Botsschade: boven deze snelheidsverandering (m/s) verliest de vondst gaafheid, per m/s erboven,
; met een maximum per klap (gevoel-06: hard gooien of een val van 2 m kost nu echt iets).
impact_threshold=3.0
impact_damage=0.06
impact_max_loss=0.3

; Vasthouden met twee handen (gevoel-06): de vondst volgt het houdpunt met een veer. Zwaarder =
; trager (stijfheid / (1 + massa / follow_mass_ref)), en hij kantelt mee met zijn naslepen.
; Afstand: hold_near + straal × hold_per_radius (een muntzak dichtbij, een schedel verder).
follow_stiffness=260.0
follow_damping=26.0
follow_mass_ref=6.0
sway_tilt_deg=14.0
hold_near=0.62
hold_per_radius=1.1
hold_drop=0.24
