; Neergaan en redden (GDD §6 Neergaan; playtest 2026-10-06: robots als ragdoll). De host beslist.
; Levens als deel van 1 (0.4 = 40%).

[values]

; Vallen (onder de grond of van een richel, niet uit De Ekster): schade vanaf fall_safe m/s, dan
; fall_damage per m/s erboven. Vanaf fall_knock m/s lig je ook even als ragdoll.
fall_safe=9.0
fall_damage=0.12
fall_knock=11.5
; Vallende rotsen (bevingen, instortingen): een kleine rots kost rock_small, een grote (unrest.big_rock)
; rock_big en gooit je omver.
rock_small=0.15
rock_big=0.4
; In de hittezone boven het magma (magma.heat_m): schade per seconde.
heat_dps=0.2
; Omver na een harde klap of val: zoveel seconden ragdoll, dan sta je weer op.
knock_s=1.8
; Neergegaan (geen levens meer): zo lang heeft de ploeg om je naar de Mol te dragen. Daarna ben je
; kapot, en vlieg je als spookdrone mee tot de dienst voorbij is.
downed_s=90.0
; In de Mol: na repair_s sta je weer op met repair_health. Wie in de Mol staat, herstelt mol_regen per s.
repair_s=4.0
repair_health=0.5
mol_regen=0.06
; Niemand meer die je kan dragen (solo, of de rest ligt ook neer): na limp_delay_s krabbel je recht
; en strompel je zelf naar de Mol, aan limp_speed × wandelen, zonder gereedschap.
limp_delay_s=2.5
limp_speed=0.45
; Een robot dragen: body_mass kg. Zwaarder dan carry.lift_max: alleen sleep je hem (drag_drop m lager,
; over de grond), met twee til je hem (dezelfde regels als zware buit, Carry.speed_for).
body_mass=24.0
drag_drop=0.6
; Spartelen als je neerligt (Spatie): een duw op de romp, hooguit om de flail_s.
flail_impulse=40.0
flail_s=1.0
; Spookdrone: vliegsnelheid (m/s).
drone_speed=6.0
; Iedereen neer of kapot: de Mol vertrekt vanzelf na wipe_s.
wipe_s=12.0
