; Onrust en bevingen (GDD §3, §6; onderzoek docs/research/magma-en-onrust.md B–E).
; Onrust stijgt enkel door lawaai. Eén trap = stage; vol = een beving.

[values]

stage=100.0
; Lawaai per seconde: handboor (draait), de Mol bij volle snelheid, de Mol die boort. Het houweel
; is stil. Een PING staat in mol.cfg (sonar_ping_noise). De Mol rijdt sinds pakket C traag (GDD §5A,
; 1,3–1,8 m/s): per seconde wat minder, per meter tunnel nog altijd luider dan vroeger (een rit naar
; het zandsteen ±55 onrust, geen beving).
drill=0.3
mol_drive=0.15
mol_drill=0.35
; Verval: decay per seconde, maar enkel na quiet_s zonder lawaai (en nooit onder het begin van de trap).
decay=0.1
quiet_s=15.0
; Voorschok vanaf pretremor_at, om de pretremor_min_s..pretremor_max_s.
pretremor_at=80.0
pretremor_min_s=8.0
pretremor_max_s=15.0
; Minstens min_gap_s tussen twee bevingen. Aankondiging warning_s, hoofdschok quake_s.
min_gap_s=90.0
warning_s=4.0
quake_s=6.0
; Wandelen tijdens de hoofdschok (×).
walk_factor=0.85
; Zones: straal, enkel zones binnen zone_reach van een speler of de Mol vallen (hooguit max_zones),
; per zone rocks_min..rocks_max rotsen van rock_min..rock_max m. Hooguit max_rocks tegelijk, ze
; vervagen na rock_life_s. Elke rots komt dust_lead_s na een stofstraal, verspreid over rock_spread_s.
zone_radius=4.0
zone_reach=40.0
max_zones=6
rocks_min=3
rocks_max=6
rock_min=0.4
rock_max=1.2
max_rocks=30
rock_life_s=40.0
dust_lead_s=1.2
rock_spread_s=5.0
; Getroffen: een kleine rots doet wankelen (stagger_s), een rots vanaf big_rock m gooit omver (knockdown_s).
big_rock=0.8
stagger_s=0.3
knockdown_s=1.2
; Schermschok (trauma 0..1, CameraFx): voorschok, aankondiging (van → tot), hoofdschok, een rots
; die vlakbij inslaat (tot 0 op 12 m), en de factor in de Mol.
trauma_pre=0.3
trauma_warn_from=0.2
trauma_warn_to=0.45
trauma_quake=0.7
trauma_rock=0.35
trauma_in_mol=0.6
