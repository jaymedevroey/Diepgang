; De Graafworm (GDD §6): zwemt onzichtbaar door de rots, komt af op lawaai, valt enkel uit in open
; ruimtes, slokt losse buit op en sleurt hem weg, en gooit spelers omver. Lichtbakens houden hem op
; afstand. Afstanden in m, tijden in s, snelheden in m/s. Per planeet: HazardParams "worm" (×).

[values]

; Slapen: zo lang na de landing (magmaklok) laat hij nog niets van zich horen.
wake_s=150.0
; Zwemmen: rondzwerven, op lawaai af, en op het einde van de dienst (spanning 1: het magma dichtbij,
; of de Mol vertrekt) sneller. Hij blijft min_above_magma boven het magma en below_surface onder het
; oppervlak (behalve als hij uitvalt).
roam_speed=2.5
hunt_speed=4.5
climax_speed=7.5
turn_rate=1.6
min_above_magma=12.0
below_surface=4.0
; Horen: een geluid op hear_m telt half, en het vervaagt met memory_s. Vanaf hunt_score gaat hij
; erop af (op het einde de helft). Luidheid per bron: een boorhap, de Mol die boort of rijdt (per s),
; per eenheid onrust van de Mol (PING, toeter), een ontploffing, en de Mol die vertrekt.
hear_m=45.0
memory_s=25.0
hunt_score=0.35
loud_drill_bite=0.12
loud_mol_drill=1.2
loud_mol_drive=0.6
loud_per_unrest=0.25
loud_explosion=5.0
loud_depart=6.0
; Uitvallen: als hij binnen lunge_reach van een speler of losse buit is, in een open ruimte (minstens
; open_m vrij boven het doel). Eerst telegraph_s waarschuwing (barsten, een stofgeiser, gerommel),
; dan burst_s de boog door de ruimte (arc_len lang, de kop in het midden arc_height boven de vloer).
; Daarna lunge_cd rust (op het einde lunge_cd_climax).
lunge_reach=9.0
open_m=1.2
telegraph_s=1.3
burst_s=1.6
arc_height=1.3
arc_len=9.0
lunge_cd=40.0
lunge_cd_climax=16.0
; Raken: wie binnen hit_radius van zijn kop komt, gaat omver met hit_damage schade en een duw van
; hit_push m/s. Losse buit binnen swallow_radius wordt opgeslokt (hooguit swallow_max per uitval),
; en die dumpt hij in een grot minstens lair_min_m verder.
hit_radius=1.9
hit_damage=0.45
hit_push=7.0
swallow_radius=2.2
swallow_max=3
lair_min_m=50.0
; De Mol rammen (gelokt door de toeter of het vertrek): rammen binnen ram_m van de Mol, hooguit om
; de ram_cd. Elke vondst in het laadruim verliest ram_cargo_loss gaafheid, de Mol valt stil, en wie
; staat gaat omver.
ram_m=7.0
ram_cd=14.0
ram_cargo_loss=0.12
ram_knock_damage=0.05
; Lichtbakens: binnen repel_m valt hij niet uit en zwemt hij weg.
repel_m=14.0
; Tekens (op elk peer): gerommel tot rumble_m van de camera, een markering op de vloer tot marker_m.
rumble_m=30.0
marker_m=24.0
; Sonar van de Mol: zo ver ziet hij de worm (een grote stip, op de rand als hij verder is).
sonar_m=70.0
