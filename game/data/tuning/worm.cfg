; De Graafworm, "the Gulper" (GDD §6): zwemt onzichtbaar door de rots, komt af op lawaai, valt uit in
; open ruimtes, grijpt wie hij raakt en sleurt hem weg, slokt losse buit op. Lichtbakens houden hem
; op afstand. Afstanden in m, tijden in s, snelheden in m/s. Per planeet: HazardParams "worm" (×).

[values]

; Slapen: zo lang na de landing (magmaklok) laat hij nog niets van zich horen.
wake_s=150.0
; Zwemmen: rondzwerven, op lawaai af, en op het einde van de dienst (spanning 1: het magma dichtbij,
; of de Mol vertrekt) sneller. Hij blijft min_above_magma boven het magma en below_surface onder het
; oppervlak (behalve als hij uitvalt).
roam_speed=2.5
hunt_speed=4.5
climax_speed=7.5
turn_rate=1.6
min_above_magma=12.0
below_surface=4.0
; Horen: een geluid op hear_m telt half, en het vervaagt met memory_s. Vanaf hunt_score gaat hij
; erop af (op het einde de helft). Luidheid per bron: een boorhap, de Mol die boort of rijdt (per s),
; per eenheid onrust van de Mol (PING, toeter), een ontploffing, en de Mol die vertrekt.
; (golf 3, ontwerp2-1: rijden 0.6 → 0.3 en boren 1.2 → 1.0: rijden alleen lokt hem minder ver.)
hear_m=45.0
memory_s=25.0
hunt_score=0.35
loud_drill_bite=0.12
loud_mol_drill=1.0
loud_mol_drive=0.3
loud_per_unrest=0.25
loud_explosion=5.0
loud_depart=6.0
; Rondsluipen (golf 3, ontwerp2-2): met kans prowl_chance sluipt hij prowl_depth onder een speler
; (prowl_s lang). Wie sense_s binnen sense_m boven hem blijft, voelt hij: dan valt hij aan.
prowl_chance=0.35
prowl_depth=7.0
prowl_s=14.0
sense_m=9.0
sense_s=5.0
; Uitvallen: als hij binnen lunge_reach van een speler of losse buit is, in een open ruimte (minstens
; open_m vrij boven het doel). Eerst telegraph_s waarschuwing (de vloer barst open en gloeit), dan
; burst_s de boog door de ruimte (arc_len lang, de kop in het midden arc_height boven de vloer):
; traag uit de rots, snel door de ruimte (golf 3: 1.3/1.6 → 1.6/1.9). Daarna lunge_cd rust (op het
; einde lunge_cd_climax).
lunge_reach=9.0
open_m=1.2
telegraph_s=1.6
burst_s=1.9
arc_height=1.3
arc_len=9.0
lunge_cd=40.0
lunge_cd_climax=16.0
; Doorbreken (golf 3, ontwerp2-2): in een krappe gang breekt hij door de wand of de vloer, maar
; enkel als het daar minstens breach_loud luid was (±25 boorhappen, of hij voelde iemand). Langere
; waarschuwing en een korte stoot.
breach_loud=3.0
breach_telegraph_s=2.0
breach_burst_s=1.4
; Raken: wie binnen hit_radius van zijn kop komt en niet gegrepen wordt, gaat omver met hit_damage
; schade en een duw van hit_push m/s. Losse buit binnen swallow_radius wordt opgeslokt (hooguit
; swallow_max per uitval), en die dumpt hij in een grot minstens lair_min_m verder.
hit_radius=1.9
hit_damage=0.45
hit_push=7.0
swallow_radius=2.2
swallow_max=3
lair_min_m=50.0
; Grijpen (golf 3, playtest "een worm die je opslokt"): wie hij raakt, grijpt hij (kans grab_chance,
; hooguit één tegelijk, dan grab_cd rust): grab_damage bij de beet, grab_dps zolang hij je vasthoudt.
; Hij sleurt je grab_drag_m over de vloer (aan grab_speed, enkel waar 1 m boven de vloer nog
; grab_open_m vrij is), minstens grab_min_s, bijt dan nog eens (grab_end_damage) na grab_chew_s en
; spuwt je uit. Los: grab_hits slagen met het houweel op de kop (binnen hit_reach van de kop), een
; baken binnen grab_beacon_m, of zelf spartelen (Spatie: elke druk grab_struggle, de greep herstelt
; grab_grip_decay per s; bij 1 ben je los).
grab_chance=1.0
grab_damage=0.2
grab_dps=0.05
grab_speed=2.6
grab_drag_m=20.0
grab_open_m=0.55
grab_min_s=5.0
grab_chew_s=1.2
grab_end_damage=0.35
grab_hits=2
hit_reach=5.5
grab_beacon_m=7.0
grab_struggle=0.11
grab_grip_decay=0.08
grab_cd=50.0
; De Mol midden in de dienst (golf 3, ontwerp2-1): hij duwt hem enkel (de Mol valt stil, wie staat
; gaat omver met ram_knock_damage, de lading blijft heel), hooguit om de shove_cd, en daarna hoort hij
; de Mol mol_deaf_s niet meer: dan zoekt hij de ploeg. Raken binnen ram_m van de Mol.
ram_m=7.0
shove_cd=60.0
mol_deaf_s=40.0
ram_knock_damage=0.05
; De climax (golf 3, ontwerp-7, ontwerp2-3): na de hendel jaagt hij op de Mol en bijt hij zich vast
; (hooguit bite_s). Zolang hij bijt, verliest elke vondst in het laadruim bite_cargo_loss_s gaafheid
; per s en rijdt de Mol aan bite_slow van zijn snelheid. Los: de piloot stuurt bite_shakes keer
; links-rechts, een baken dichtbij (een baken uit de achterklep), of bite_hits slagen op de kop. Daarna
; zwemt hij bite_repel_s weg en wacht hij bite_cd voor de volgende beet.
bite_s=6.0
bite_cargo_loss_s=0.035
bite_slow=0.45
bite_shakes=4
bite_hits=2
bite_repel_s=4.0
bite_cd=10.0
; Lichtbakens: binnen repel_m valt hij niet uit en zwemt hij weg. Een baken in een rijdende Mol telt
; niet.
repel_m=14.0
; Tekens (op elk peer): gerommel tot rumble_m van de camera, een markering op de vloer tot marker_m.
rumble_m=30.0
marker_m=24.0
; Sonar van de Mol: zo ver ziet hij de worm (een grote rode stip, op de rand als hij verder is).
sonar_m=70.0
