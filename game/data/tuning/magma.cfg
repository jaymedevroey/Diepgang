; Magma: de enige klok van een dienst (GDD §3, §6; onderzoek docs/research/magma-en-onrust.md).
; Afstanden in meter, tijden in seconden, snelheden in m/s.

[values]

; Curve: start op start_depth onder de landingsplek. Tot sleep_s staat het stil, tot ramp_s loopt
; de snelheid op van 0 naar speed_1, tot late_s lineair naar speed_2, daarna blijft ze speed_2.
; Zonder bevingen is het magma zo na ±21 min aan het oppervlak.
start_depth=310.0
sleep_s=120.0
ramp_s=300.0
speed_1=0.22
late_s=1260.0
speed_2=0.38
; Elke beving zet de klok quake_advance_s vooruit, als een golf over wave_s (geen knip).
quake_advance_s=40.0
wave_s=10.0
; Zo diep onder de landingsplek komt de noodophaling vanzelf (de Mol vertrekt naar boven).
recall_depth=60.0
; Alarm in de Mol als het magma zoveel meter onder de Mol staat.
alarm_1=40.0
alarm_2=20.0
alarm_3=10.0
; De Mol in het magma: na mol_heat_s is hij te heet en trekt DIG hem op afstand naar boven.
mol_heat_s=25.0
; Losse buit in het magma is na swallow_s weg.
swallow_s=1.5
; Beeld: vanaf hoe ver boven het magma de wanden van onderen oplichten (glow_m), de hittezone
; (heat_m, voeten boven het magma: rode rand, trilling, een waarschuwing), tot hoe hoog de lucht
; trilt (shimmer_m, de camera) en tot hoe hoog de rots erboven opwarmt (rock_heat_m).
glow_m=45.0
heat_m=3.0
shimmer_m=14.0
rock_heat_m=12.0
; Smelten duurt melt_s: het beeld wordt wit-oranje en dan zwart, daarna staat de vervanger klaar.
melt_s=1.5
