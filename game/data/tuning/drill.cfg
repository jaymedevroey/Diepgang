; Boor T1 (GDD §5: snel en luid, beschadigt buit). Tijden in s, afstanden in m.

[values]

reach=2.8
; Aanloop tot volle snelheid, en uitloop na loslaten.
spinup_s=0.22
spindown_s=0.35

; Elke hap: bol met deze straal die zoveel voorbij het raakpunt bijt, langs de kijkrichting.
; Hapfrequentie = dig.max_ops_per_second (8/s): 0,15 m × 8 = 1,2 m/s vooruit.
bite_radius=0.8
bite_depth=0.15

; Hitte: +1 per seconde boren, -2 per seconde rust. Oververhit bij max: stil voor lockout_s.
heat_max=5.5
heat_rate=1.0
cool_rate=2.0
lockout_s=4.0

; Speler loopt trager terwijl de boor draait.
move_multiplier=0.5

; Camera: continu licht trillen tijdens het boren.
shake_per_s=1.2
shake_cap=0.32
