; Boor T1 (GDD §5: snel en luid, beschadigt buit). Tijden in s, afstanden in m.

[values]

; Bereik: korter dan het houweel, zodat het bit dicht bij de wand blijft (gevoel-15).
reach=2.3
; Aanloop tot volle snelheid, en uitloop na loslaten.
spinup_s=0.22
spindown_s=0.35

; Elke hap: bol met deze straal die zoveel voorbij het raakpunt bijt, langs de kijkrichting.
; Happen per seconde in speltijd (niet meer dan dig.max_ops_per_second, dat is het vangnet).
; Hardheid per laag (gevoel-11): klei 0,26 × 8 = ±2 m/s (houweel ±0,7 m/s), zandsteen 0,11 × 8 = ±0,9 m/s.
bites_per_s=8.0
bite_radius=0.8
bite_depth_klei=0.26
bite_depth_zandsteen=0.11

; Hitte per seconde boren, per laag (harder = heter), en zonder iets te raken. -2 per seconde rust.
; Oververhit bij max: stil voor lockout_s. Klei: ±7 s boren, zandsteen ±4,5 s.
heat_max=5.5
heat_rate_klei=0.75
heat_rate_zandsteen=1.25
heat_rate_idle=0.6
cool_rate=2.0
lockout_s=4.0
; Gloed van bit en kop bij volle hitte (emissie), en hoe ver de boor bij contact naar voren schuift (m).
glow_energy=3.0
push_m=0.14

; Speler loopt trager terwijl de boor draait.
move_multiplier=0.5

; Camera: continu licht trillen tijdens het boren.
shake_per_s=1.2
shake_cap=0.32
