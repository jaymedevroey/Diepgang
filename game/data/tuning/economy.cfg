; Economie en voortgang (pakket F1, GDD §3.9-10, §5, §5A): taxatie en verkoop, upgrades, het
; laadruim en de voorwaarden van een opdracht. Bedragen in euro, gewichten in kg, tijden in s.

[values]

; --- Taxatie en verkoop (GDD §3.9) ---
; Elke vondst die door de taxatiepoort gaat, wordt één voor één onthuld (soort, gaafheid, waarde),
; met reveal_gap_s tussen twee onthullingen. Verkopen gebeurt aan het verkoopluik (E).
reveal_gap_s=1.1
; Golf 3 (de ceremonie, ui2-01, binnen2-10, ontwerp2-9): een band van de klep van de Mol door de poort
; naar het luik (belt_speed m/s). Onder de scanner stopt hij: scan_s de scanstraal, dan staat hij
; reveal_hold_s stil terwijl het scherm de waarde optelt. Aan het luik gaat elk stuk sell_gap_s na
; het vorige het luik in (het scherm telt mee op).
belt_speed=0.6
scan_s=0.9
reveal_hold_s=1.8
sell_gap_s=0.35
; Hoe ver een speler van het verkoopluik of een toonbank mag staan (host controleert).
counter_reach_m=5.0
; Wat na de dienst niet verkocht werd, koopt het hoofdkantoor op als je de volgende opdracht
; tekent, aan dit deel van de waarde.
unsold_factor=0.6
; Een volledige set (alle stukken van één skelet, set_id/set_size van de vondsten) verkocht na
; dezelfde dienst: zoveel extra bovenop de waarde van de set (1.0 = dubbel).
set_bonus=1.0
; Doelvondst van een opdracht ("het hoofdkantoor wil een schedel"): bonus = de basiswaarde van de
; soort, met een minimum.
target_bonus_min=250

; --- Schatting in het veld (golf 3, ontwerp2-4) ---
; Het draagkaartje en het scherm in de Mol tonen een bandbreedte, de poort de echte prijs. De
; onderkant ligt tussen estimate_low_min en estimate_low_min + estimate_low_span keer de echte
; waarde (per vondst anders), de bovenkant is estimate_ratio keer de onderkant. Zo zit de echte
; waarde er altijd in (0,62 × 1,65 > 1), maar niet altijd in het midden.
estimate_low_min=0.62
estimate_low_span=0.28
estimate_ratio=1.65

; --- Upgrades (prijs voor een ploeg van 4; kleinere ploegen betalen hetzelfde deel als hun
; quota, company.cfg quota_p1..p4: solo 40%). Elke upgrade laat je iets nieuws doen.
; Golf 3 (ontwerp2-10): ×1,5. Solo alles samen €15.600 (was €10.400, na ±5-8 diensten alles
; gekocht); met ±€1.100-3.000 per dienst (schatting) is dat ±6-12 diensten. Na een speeltest bijstellen.
; Boor T2: graniet en kristal graven (te voet).
price_drill_t2=9000
; Boorkop T2 van de Mol: de Mol boort door graniet en kristal.
price_mol_head_t2=12000
; Handscanner T1: blips van vondsten in de buurt, te voet (Q).
price_scanner=6000
; Helmlamp T2: een bundel die een hele grot verlicht.
price_lamp=5000
; Groter laadruim van de Mol.
price_cargo=7000

; --- Laadruim van de Mol (GDD §5A "capaciteit is beperkt (gewicht)") ---
; Wat de grijper kan optillen voor één robot; met de upgrade cargo_kg_t2. Te zwaar: de hendel
; weigert, en wat niet past, valt eruit als de grijper vastklikt.
; Golf 3 (ontwerp2-6): plus cargo_kg_per_robot voor elke robot na de eerste (60/80/100/120 kg,
; met de upgrade 140/160/180/200 kg). De quota schaalt ×2,5 met de ploeg; een Titan-skelet weegt
; 62-120 kg en past zo met vier zonder upgrade, solo enkel met de upgrade.
cargo_kg=60.0
cargo_kg_t2=140.0
cargo_kg_per_robot=20.0

