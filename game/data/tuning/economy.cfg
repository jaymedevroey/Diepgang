; Economie en voortgang (pakket F1, GDD §3.9-10, §5, §5A): taxatie en verkoop, upgrades, het
; laadruim en de voorwaarden van een opdracht. Bedragen in euro, gewichten in kg, tijden in s.

[values]

; --- Taxatie en verkoop (GDD §3.9) ---
; Elke vondst die door de taxatiepoort gaat, wordt één voor één onthuld (soort, gaafheid, waarde),
; met reveal_gap_s tussen twee onthullingen. Verkopen gebeurt aan het verkoopluik (E).
reveal_gap_s=1.1
; Hoe ver een speler van het verkoopluik of een toonbank mag staan (host controleert).
counter_reach_m=5.0
; Wat na de dienst niet verkocht werd, koopt het hoofdkantoor op als je de volgende opdracht
; tekent, aan dit deel van de waarde.
unsold_factor=0.6
; Een volledige set (alle stukken van één skelet, set_id/set_size van de vondsten) verkocht na
; dezelfde dienst: zoveel extra bovenop de waarde van de set (1.0 = dubbel).
set_bonus=1.0
; Doelvondst van een opdracht ("het hoofdkantoor wil een schedel"): bonus = de basiswaarde van de
; soort, met een minimum.
target_bonus_min=250

; --- Upgrades (prijs voor een ploeg van 4; kleinere ploegen betalen hetzelfde deel als hun
; quota, company.cfg quota_p1..p4: solo 40%). Elke upgrade laat je iets nieuws doen.
; Boor T2: graniet en kristal graven (te voet).
price_drill_t2=6000
; Boorkop T2 van de Mol: de Mol boort door graniet en kristal.
price_mol_head_t2=8000
; Handscanner T1: blips van vondsten in de buurt, te voet (Q).
price_scanner=4000
; Helmlamp T2: een bundel die een hele grot verlicht.
price_lamp=3500
; Groter laadruim van de Mol.
price_cargo=4500

; --- Laadruim van de Mol (GDD §5A "capaciteit is beperkt (gewicht)") ---
; Wat de grijper kan optillen; met de upgrade cargo_kg_t2. Te zwaar: de hendel weigert, en wat
; niet past, valt eruit als de grijper vastklikt.
cargo_kg=60.0
cargo_kg_t2=140.0

; --- Handscanner T1 (GDD §5: blips, nooit "alles zichtbaar") ---
; Een puls loopt in scan_pulse_s uit tot scan_range_m; elke vondst in de rots of los (niet in de
; Mol) geeft een vage blip die scan_hold_s blijft staan. Daarna scan_cooldown_s opladen.
scan_range_m=10.0
scan_pulse_s=0.5
scan_hold_s=5.0
scan_cooldown_s=4.0
; Onzekerheid van een blip (m): vast plus per meter afstand.
scan_jitter=0.6
scan_jitter_per_m=0.08

; --- Helmlamp T2 ---
lamp2_range=42.0
lamp2_angle=58.0
lamp2_energy=1.6
lamp2_fill_range=22.0

; --- Voorwaarden van een opdracht (ontwerp-10, ui-03) ---
; Opkopers: deze soort vondsten brengt meer op.
mod_bone_buyer=1.4
mod_geode_buyer=1.4
mod_scrap_buyer=3.0
; Erts brengt meer op.
mod_ore_price=1.4
; Extra fossielbedden en ertsaders in de wereld.
mod_fossil_beds=4
mod_ore_veins=8
; Onstabiele grond: onrust per seconde, ook als het stil is (en ze zakt niet meer terug).
mod_unstable_rate=0.12
; Hete kern: het magma stijgt zoveel sneller.
mod_hot_core=1.25
; Krappe brandstof: de Mol begint met dit deel van zijn tank.
mod_low_fuel=0.65
