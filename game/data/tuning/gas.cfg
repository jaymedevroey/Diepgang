; Gasbellen (GDD §6): een zichtbare gele waas in grotten en gangen, dieper meer. Ze ontploffen bij
; vonken: de boor, de boorkop van de Mol, een andere ontploffing, of het magma dat ze bereikt.
; Afstanden in m, tijden in s. Per planeet: HazardParams "gas" (× aantal).

[values]

; Aantal bellen per wereld, niet ondieper dan min_depth_m, en niet binnen safe_landing_m van de
; landingsplek (golf 3, ontwerp2-2: 35 → 22 m en 30 → 18 m, zodat er ook ondiep en dichtbij gas zit). Hoe dieper, hoe meer (vanaf full_depth_m de volle kans). in_caves: deel in grotten
; (de rest zit opgesloten in de rots en komt vrij als je erin graaft).
pockets=16
min_depth_m=22.0
full_depth_m=150.0
safe_landing_m=18.0
in_caves=0.65
; Van de bellen in de rots ligt near_share in een ring tot near_m rond de landingsplek, waar de ploeg
; werkt (golf 3, ontwerp2-2).
near_share=0.35
near_m=70.0
radius_min=2.5
radius_max=4.5
; Een opgesloten bel die je openbreekt, sist eerst breach_grace_s (dan ontsteekt een boor hem nog niet).
breach_grace_s=2.0
; Ontsteken: fuse_s sissen en oplichten, dan de ontploffing. Een krater van crater_m (de rots kan enkel
; weg), schade tot blast_k × de straal, en binnen inner_k × de straal ga je neer. Een duw van push m/s.
fuse_s=0.6
crater_m=2.4
blast_k=2.2
inner_k=0.6
damage_max=0.85
push=9.0
; Een ontploffing ontsteekt andere bellen binnen hun straal + chain_m. Lawaai (onrust) per ontploffing.
chain_m=4.0
noise=25.0
; Het magma ontsteekt een bel als het tot magma_ignite_m onder het midden komt.
magma_ignite_m=2.0
; Beeld: waas tekenen tot view_m van de camera.
view_m=55.0
