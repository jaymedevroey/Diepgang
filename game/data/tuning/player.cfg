; Tijdelijke M0-speler. Wordt in M1 vervangen door de robot.

[values]

move_speed=4.5
jump_velocity=4.5
fly_speed=12.0
mouse_sensitivity=0.0025
fov=80.0

; Helmlamp: energie en afval met de afstand (1 = 1/afstand; lager = vlakker: vlak voor je minder
; fel, verder weg iets meer). Op 1 m was de kern een egale vlek op de klei (gevoel-19).
lamp_energy=4.0
lamp_decay=0.65
; Brede gloed rond de helmlamp (geen harde lichtcirkel).
lamp_fill_energy=0.9
; Nep-terugkaatsing van de helmlamp op de rots (zwakke lamp in de kleur van de laag).
lamp_bounce_energy=0.35
; Vallen (bv. uit de baai van De Ekster springen): niet sneller dan dit (m/s).
max_fall_speed=40.0
; Treden in De Ekster: zo hoog stap je zonder springen op een rand (m). Trappen zijn hellingen.
step_height=0.25

; --- Bewegen (release-audit gevoel-01) ---
; Sprint (Shift, enkel vooruit, geen uithouding zoals DRG; niet gehurkt, niet met de boor aan,
; niet met iets zwaars, zie carry.sprint_max_mass). Hurken (Ctrl): lager en trager.
sprint_speed=6.8
crouch_speed=2.2
crouch_height=0.95
crouch_eye=0.78
crouch_eye_speed=3.5
; Versnellen en remmen op de grond (m/s²): 4,5 m/s in ±0,11 s, stil in ±0,09 s. In de lucht weinig controle.
ground_accel=40.0
ground_decel=50.0
air_accel=9.0
; Springen: nog kunnen springen zo lang na het afstappen, en een te vroege druk zo lang onthouden (s).
coyote_s=0.1
jump_buffer_s=0.12
; Landen: vanaf deze valsnelheid (m/s) zakt het oog door (veer), vanaf land_dust_speed ook stof.
; land_dip_max = beginsnelheid van de dip bij een harde val (m/s, ±0,12 m diep).
land_min_speed=2.5
land_dust_speed=6.0
land_dip_max=3.0
land_dip_stiffness=160.0
land_dip_damping=15.0
; Loopbeweging van de camera (uit te zetten: instelling "Head bob"): hoogte (m) per stap,
; staplengte (m), en kanteling bij zijwaarts lopen (graden).
bob_height=0.022
step_length=1.6
strafe_tilt_deg=1.2
; Sprinten (golf 3, gevoel2-16): sprint_fov_deg graden breder (in sprint_fov_speed graden per s), langere
; passen (sprint_step_length m) die sprint_bob keer hoger wippen, met een zwaai van sprint_sway_deg.
; In een bocht kantel je mee: turn_tilt per rad/s draaien, hooguit turn_tilt_max_deg (wandelend 40%).
; Alles uit met de instelling "Head bob".
sprint_fov_deg=7.0
sprint_fov_speed=28.0
sprint_step_length=2.1
sprint_bob=1.7
sprint_sway_deg=0.7
turn_tilt=0.3
turn_tilt_max_deg=2.5
; Gehurkt vast onder een overhang (gevoel2-13): zo snel schuif je vanzelf naar een plek waar je recht
; kan staan (m/s). De HUD zegt waarom je niet rechtkomt.
unstick_speed=1.2
