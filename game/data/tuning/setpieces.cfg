; Set pieces in de grotten (golf 3, binnen-01: grotten als bestemming). CaveSetPieces en FindField.

[values]

; De startgrot: een grot in de klei bij de landingsplek met een oude toegangsgang van de vorige
; ploeg (PlanetGenerator._plan_starter). 1 = aan, 0 = uit.
starter_cave=1
; Welk deel van de andere grotten een set piece krijgt (de twee dichtste in de klei krijgen er altijd een).
share=0.34
; Enkel in grotten van minstens zoveel meter breed (straal).
min_radius_m=4.5
; Buit bij een set piece: zoveel vondsten in de wanden en de vloer errond (min en max).
loot_min=4
loot_max=6
; Bij de startgrot (het kamp van de vorige ploeg) wat meer.
starter_loot=7
; Bouwen als de camera zo dicht bij de rand van de grot komt (m), en weer weg verder dan free_m.
build_m=60.0
free_m=100.0
; De werflamp van het kamp: energie, bereik (m), en hoe vaak hij hapert (per minuut).
lamp_energy=5.0
lamp_range=18.0
lamp_flicker_per_min=5.0
