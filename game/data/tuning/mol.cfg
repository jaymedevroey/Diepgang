; De Mol (docs/de-mol.md). Snelheden in m/s, hoeken in graden.

[values]

; Rijden. Door rots boort hij trager; door een vrije tunnel sneller.
bore_speed=3.0
open_speed=5.0
reverse_speed=2.0
acceleration=1.6
; Afremmen gaat sneller dan optrekken (rupsen).
braking=4.0
; Draaien en de neus heffen/laten zakken (en de grens daarvan: binnen kan je dan nog staan).
yaw_rate_deg=22.0
pitch_rate_deg=12.0
max_pitch_deg=25.0

; Autopiloot: afdalen in een spiraal, extractie langs het eigen spoor terug.
auto_speed=6.0
auto_pitch_deg=22.0
spiral_radius=11.0
extract_speed=6.0
countdown_s=10.0

; Brandstof: zoveel meter boren of rijden op een volle tank.
fuel_m_boring=1000.0
fuel_m_driving=3000.0

; Sonar in de cabine (scanner T1: vage blips). Stil bereik in meter, een veeg duurt sonar_period s,
; een blip dooft uit met sonar_decay s. Onzekerheid van een echo: jitter + jitter_per_m × afstand,
; maal (1 + lawaai × noise_jitter). Lawaai: rijden (bij volle snelheid) en boren.
sonar_range=12.0
; PING: een ring tot ping_range m (ping_speed m/s), scherpe echo's (ping_jitter + per_m × afstand)
; die ping_decay s blijven staan. Daarna ping_cooldown s opladen. Luid: ping_noise onrust.
sonar_ping_range=24.0
sonar_ping_speed=40.0
sonar_ping_jitter=0.15
sonar_ping_jitter_per_m=0.01
sonar_ping_decay=5.0
sonar_ping_cooldown=8.0
sonar_ping_noise=5.0
sonar_period=2.4
sonar_decay=1.5
sonar_jitter=0.5
sonar_jitter_per_m=0.05
sonar_noise_jitter=2.0
sonar_noise_driving=0.35
sonar_noise_drilling=0.7
; Binnen ±level meter hoogteverschil: "gelijk". Dichter dan sonar_warn: waarschuwing (de boorkop
; schept een vondst op als hij hem raakt, en dan is hij veel minder waard).
sonar_level=2.5
sonar_warn=8.0
