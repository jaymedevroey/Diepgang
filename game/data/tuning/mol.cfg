; De Mol (docs/de-mol.md). Snelheden in m/s, hoeken in graden.

[values]

; Rijden (GDD §5A: traag, ±1,5 m/s, trager tijdens het boren). Door rots boort hij trager; door een
; vrije tunnel iets sneller. Optrekken is traag (een zware machine), maar motor, hendels en cabine
; reageren meteen op de invoer (zie de cabine hieronder).
bore_speed=1.3
open_speed=1.8
reverse_speed=1.0
acceleration=0.9
; Afremmen gaat sneller dan optrekken (rupsen).
braking=2.6
; Draaien en de neus heffen/laten zakken (en de grens daarvan: binnen kan je dan nog staan).
; Draaien en kantelen komen op gang en vallen stil met een hoekversnelling (graden/s²).
yaw_rate_deg=18.0
yaw_accel_deg=36.0
pitch_rate_deg=10.0
pitch_accel_deg=30.0
max_pitch_deg=25.0

; Autopiloot: afdalen in een spiraal (nooit sneller dan zelf boren), extractie langs het eigen
; spoor terug. De spiraal kiest bij de start een draairichting en straal die de vondsten in de
; rots spaart (spiral_radius ± spiral_radius_spread, in m). Knoppen: klei (auto_clay_m), net in het zandsteen
; (auto_sand_below_m onder de bovenkant van het zandsteen, waar de botten beginnen) en diep in
; het zandsteen (auto_deep_above_m boven het graniet, dat de T1-kop niet aankan).
auto_speed=1.3
auto_pitch_deg=22.0
spiral_radius=11.0
spiral_radius_spread=3.0
auto_clay_m=25.0
auto_sand_below_m=8.0
auto_deep_above_m=25.0
extract_speed=6.0
countdown_s=10.0

; Brandstof: zoveel meter boren of rijden op een volle tank (per dienst; GDD §5A: beperkt).
fuel_m_boring=600.0
fuel_m_driving=2000.0

; Gevoel in de cabine (enkel beeld, lokaal): schok (trauma 0..1, CameraFx) bij rijden aan volle
; snelheid, bij boren en bij een harde laag; hellen van de camera per m/s² versnelling (graden,
; hooguit cabin_lean_max_deg) en overhellen in de bocht. De veer (stijfheid, demping) geeft de ruk
; bij optrekken en stoppen. Het model van buiten veert en helt mee (model_*), en trilt bij boren.
cabin_trauma_drive=0.26
cabin_trauma_drill=0.5
cabin_trauma_blocked=0.62
cabin_lean_deg=1.6
cabin_lean_max_deg=3.0
cabin_roll_deg=1.2
cabin_spring=60.0
cabin_damping=7.0
model_lean_deg=1.4
model_roll_deg=1.6
model_drill_shake=0.025

; Sonar in de cabine (scanner T1: vage blips). Stil bereik in meter, een veeg duurt sonar_period s,
; een blip dooft uit met sonar_decay s. Onzekerheid van een echo: jitter + jitter_per_m × afstand,
; maal (1 + lawaai × noise_jitter). Lawaai: rijden (bij volle snelheid) en boren.
sonar_range=12.0
; PING: een ring tot ping_range m (ping_speed m/s), scherpe echo's (ping_jitter + per_m × afstand)
; die ping_decay s blijven staan. Daarna ping_cooldown s opladen. Luid: ping_noise onrust. Een
; dienst heeft maar sonar_pings PINGs (de condensator wordt boven in De Ekster opgeladen): elke
; PING is een keuze van de ploeg.
sonar_ping_range=24.0
sonar_ping_speed=40.0
sonar_ping_jitter=0.15
sonar_ping_jitter_per_m=0.01
sonar_ping_decay=5.0
sonar_ping_cooldown=8.0
sonar_ping_noise=12.0
sonar_pings=4
sonar_period=2.4
sonar_decay=1.5
sonar_jitter=0.5
sonar_jitter_per_m=0.05
sonar_noise_jitter=2.0
sonar_noise_driving=0.35
sonar_noise_drilling=0.7
; Binnen ±level meter hoogteverschil: "gelijk". Dichter dan sonar_warn: waarschuwing (de boorkop
; schept een vondst op als hij hem raakt, en dan is hij veel minder waard).
sonar_level=2.5
sonar_warn=8.0
