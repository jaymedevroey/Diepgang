; Hoe de drie planeten anders spelen (release-audit ontwerp-5, GDD §4 Planeettypes). Per planeet een
; achtervoegsel: _roestbol, _fossiel, _kristal. Code: PlanetLoot (buit) en PlanetType.params (gevaren).

[values]

; Fossielbedden: één skelet per bed (een set, ontwerp-9). Het deel ervan dat een groot Titan-skelet
; is (5-8 stukken, 2-4 te zwaar om alleen te tillen); de rest is een kleine Sand strider (3-5).
beds_roestbol=6
beds_fossiel=12
beds_kristal=3
titan_share_roestbol=0.0
titan_share_fossiel=0.75
titan_share_kristal=0.0
; Bovenkant van de bedden (m onder het oppervlak): Roestbol en Kristalmaan in het zandsteen (vanaf
; ±70 m), Fossielwereld al in de kalksteen bovenaan. Plus een paar diepe bedden in het graniet (boor T2).
bed_top_m_roestbol=74.0
bed_top_m_fossiel=18.0
bed_top_m_kristal=74.0
deep_beds_roestbol=2
deep_beds_fossiel=3
deep_beds_kristal=1
; Zoveel van de bedden liggen net naast een grot: van in de grot zie je de botten in de wand
; (GDD §4: "geconcentreerd in fossielbedden en rond grotten, niet uniform").
bed_cave_share_roestbol=0.5
bed_cave_share_fossiel=0.5
bed_cave_share_kristal=0.5

; Kampen van vorige bezoekers: een hoopje rommel (tv, kabouter, flessen, munten, een lamp) in de klei.
camps_roestbol=5
camps_fossiel=1
camps_kristal=1
; Kristalgrotten: 3-5 lichtgevende kristallen net achter de wand van één grot.
pockets_roestbol=0
pockets_fossiel=0
pockets_kristal=9

; Losse vondsten: in groepjes net achter de wand van een paar rijke grotten (rich_caves), en verspreid
; (minder dan vroeger: 45 rond willekeurige grotten en 60 verspreid).
rich_caves_roestbol=10
rich_caves_fossiel=8
rich_caves_kristal=12
near_caves_roestbol=40
near_caves_fossiel=28
near_caves_kristal=40
scattered_roestbol=20
scattered_fossiel=14
scattered_kristal=14

; Erts: zoveel keer de aders van ore.cfg. Roestbol is vast inkomen, op Fossielwereld zijn de botten het geld.
ore_veins_roestbol=1.25
ore_veins_fossiel=0.7
ore_veins_kristal=1.0
; Kristalmaan: in het zandsteen lichtkristal in plaats van ijzer (1 = ja).
glow_ore_in_sand_roestbol=0
glow_ore_in_sand_fossiel=0
glow_ore_in_sand_kristal=1

; Gevaren (pakket F2 leest ze via PlanetType.params(id): gas_mult, worm_mult, quake_mult; 1 = gewoon).
; Kristalmaan: meer gasbellen en een actievere Graafworm (GDD §4). Fossielwereld: brokkelige kalk.
gas_roestbol=0.5
gas_fossiel=0.8
gas_kristal=2.0
worm_roestbol=0.7
worm_fossiel=1.0
worm_kristal=1.6
quake_roestbol=1.0
quake_fossiel=1.2
quake_kristal=1.0
