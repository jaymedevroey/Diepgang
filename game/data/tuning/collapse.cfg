; Instortingen die met de diepte toenemen (GDD §6, playtest 2026-10-06). Tussen de bevingen door
; stort een onstabiele zone in de buurt soms vanzelf in: eerst kraakt het en sijpelt er stof, dan
; vallen er rotsen. Grote rotsen blijven liggen als puin dat je wegbikt (de rots zelf groeit nooit
; aan). Per planeet: HazardParams "collapse" (× kans).

[values]

; Kans per zone per minuut: rate_per_100m × (diepte − start_m) / 100, hooguit max_rate. Maal
; (1 + unrest_k × onrust) en (1 + tension_k × spanning van de dienst).
rate_per_100m=0.035
start_m=20.0
max_rate=0.12
unrest_k=1.5
tension_k=1.0
; Enkel zones binnen near_m van een speler, om de check_s nagekeken; niet de eerste quiet_s van een dienst.
; Binnen 6 m van een speler is de kans near_boost × zo groot, aan de rand van near_m 0,6 × (golf 3,
; ontwerp2-2: ook wie voorzichtig werkt, staat eens onder een zone die het begeeft).
near_m=28.0
near_boost=2.5
check_s=4.0
quiet_s=90.0
; Waarschuwing: zoveel seconden stof en gekraak vóór de eerste rots. Rotsen per instorting.
; Golf 3 (gevoel2-01): iets langer (was 1,6 s), en wie binnen warn_near_m staat, ziet het aanzwellen:
; het beeld rolt steeds harder (tot warn_rumble_deg), steentjes vallen al uit het plafond van de zone,
; en de helmlamp hapert.
warn_s=2.2
warn_near_m=16.0
warn_rumble_deg=2.2
rocks_min=2
rocks_max=5
spread_s=2.0
; Puin: rotsen vanaf rubble_size m blijven liggen en houden je tegen. Wegbikken: rubble_hp + per_m × grootte
; levens (het houweel 1 per slag, de boor drill_damage per tik). Elke slag laat het barsten en krimpen
; (tot rubble_shrink kleiner vlak voor het uiteenvalt).
rubble_size=0.7
rubble_hp=2.0
rubble_hp_per_m=4.0
drill_damage=0.5
rubble_shrink=0.3
; Zones per wereld: zones verspreid in de rots, hoe dieper hoe dichter (zie Unrest).
zones=90
; Een opdracht met "Shaky ground" (pakket F1): zoveel keer meer zones en zoveel keer meer kans.
unstable_zones=1.4
unstable_rate=2.0
