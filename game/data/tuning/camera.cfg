; Camera-effecten. screen_shake_scale komt later in het instellingenmenu (GDD §7: uit te zetten).

[values]

screen_shake_scale=1.0
; Hoe snel "trauma" wegebt per seconde, en de maximale schokhoek in graden.
trauma_decay=1.6
shake_max_deg=2.2
shake_frequency=22.0
; Veer die de camera-kick terugbrengt.
kick_stiffness=180.0
kick_damping=18.0

; Klapmoment (golf 3, gevoel2-02): een flits over het beeld (hooguit impact_flash_max dekking, dooft
; met impact_flash_fade per s) en een FOV-stoot van impact_fov_deg (een veer). Bij omver of neer blijft
; het beeld impact_hold_s staan (hit-stop) en glijdt het dan in impact_blend_s naar de volgcamera. Twee
; klappen binnen impact_merge_s (de voorspelling en daarna de host) tellen als één.
impact_flash_max=0.55
impact_flash_fade=2.6
impact_fov_deg=9.0
impact_fov_stiffness=120.0
impact_fov_damping=14.0
impact_hold_s=0.14
impact_blend_s=0.32
impact_merge_s=0.25
; Volgcamera (omver, neer): follow_dist m achter en boven de pop, nooit dichter dan follow_min als het
; kan (anders eerst hoger, dan opzij), als bol van follow_radius m. Dichter dan follow_hide_self (een
; nauwe gang): de eigen robot verdwijnt. Gedragen draait ze mee met de drager (follow_carried_turn per s),
; schuin opzij (follow_carried_side rad), zodat je drager je niet verbergt.
; Opstaan: het beeld glijdt in stand_glide_s terug in de ogen, met de kijkrichting van de camera.
follow_dist=3.2
follow_min=1.2
follow_radius=0.22
follow_hide_self=0.7
follow_carried_turn=2.5
follow_carried_side=0.8
stand_glide_s=0.35
