; Hemel, horizon en lucht boven de planeet (docs/research/hemel.md). Afstanden in meter.

[values]

; Straal van de gestileerde planeet: de kim zakt √(2h/R) onder de horizontale lijn, en het verre
; landschap buigt even hard weg (anders zie je van hoog in de lucht een vierkant plateau).
planet_radius_m=30000.0
; Tot zover van de landingsplek loopt het verre landschap (voorbij de horizon op 360 m hoogte: 4,6 km).
horizon_m=6500.0
; Mist hoog in de lucht: de dichtheid aan de grond maal deze factor boven 250 m.
fog_altitude_factor=0.4
; Omgevingslicht in De Ekster (koel vullicht; lager = meer contrast in de hub).
ship_ambient_energy=0.36
; Zo diep onder de baai van de hub hangt het planeetdek (tekent "de planeet ver onder je").
hub_deck_below_m=250.0
; Hoe ver de zon schaduw werpt als je hoog in de lucht hangt (de drop; aan de grond 140 m).
drop_shadow_m=900.0
; Contrast van de tonemapper (AgX) aan de oppervlakte, per hemel (a Roestbol, b Fossielwereld, c Kristalmaan).
; Onder de grond en in De Ekster altijd de basis (a). Fossielwereld is licht onder een lichte hemel:
; een steilere curve maakt de schaduwkanten diep zonder de kalk te verbleken (release-audit buiten-3).
agx_contrast_a=1.35
agx_contrast_b=1.5
agx_contrast_c=1.35
