; Vondsten en korsten (GDD §3-4).

[values]

; Aantal vondsten in de put, waarvan zoveel ondiep rond de spawn (om meteen te testen).
count=36
near_spawn=5
; Minimale afstand tussen twee vondsten (korsten mogen niet overlappen).
min_spacing=2.0

; Korst: levens. Houweel: 1 per slag, geen schade. Boor: per hap minder levens, maar de
; vondst verliest gaafheid (waarde = basiswaarde × gaafheid, nooit onder de ondergrens).
crust_hp=4.0
pickaxe_damage=1.0
drill_damage=0.5
drill_condition_loss=0.04
min_condition=0.25

; Minimale tijd tussen twee treffers per speler (validatie door de host, in echte tijd).
; Ruim onder het echte tempo (zwaai 0,55 s, boor 0,1 s): speltijd en echte tijd kunnen
; tot 20% verschillen.
pickaxe_min_interval=0.25
drill_min_interval=0.06

; Na het breken van de korst: zoveel ruimte rond de vondst uitgraven, en een duwtje omhoog.
free_margin=0.35
free_impulse=1.2

; Rijdt de boorkop van de Mol in een vondst die nog in de rots zit, dan schept hij hem op in het
; laadruim, maar hij houdt maximaal zoveel gaafheid over.
mol_condition=0.3
