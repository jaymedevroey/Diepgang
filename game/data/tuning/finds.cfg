; Vondsten en korsten (GDD §3-4).

[values]

; Vondsten op de planeet: zoveel ondiep rond de landingsplek (de eerste is een bot). De rest (bedden,
; kampen, kristalgrotten, rond grotten, verspreid) verschilt per planeet: zie planets.cfg.
near_spawn=5
; Minimale afstand tussen twee vondsten (korsten mogen niet overlappen; grote stukken houden meer).
min_spacing=2.0

; Breekbare vondsten (kristallen en geodes, FindKinds.FRAGILITY: geode 0,5, glowshard 1, kristalroos
; 1,4). Een klap telt al vanaf carry.impact_threshold / (1 + breekbaarheid × fragile_threshold_factor)
; m/s, kost per m/s (1 + breekbaarheid × fragile_damage_factor) keer meer, en vanaf shatter_dv /
; breekbaarheid m/s breekt hij: gaafheid shatter_condition, het licht uit. Neerzetten (E) is veilig,
; gooien of laten vallen van op draaghoogte (±4,8 m/s) breekt een glowshard. De boor: maal
; (1 + breekbaarheid × drill_fragile_factor) schade per hap; het houweel blijft veilig.
fragile_threshold_factor=1.2
fragile_damage_factor=2.0
shatter_dv=4.5
shatter_condition=0.08
drill_fragile_factor=1.2
; Lichtgevende vondsten (glowshard, kristalroos): een lampje zodra ze los zijn (energie, bereik in m).
glow_energy=0.9
glow_range=2.6

; Korst (ontwerp-11: houweel tegenover boor is een echte afweging). Levens = crust_hp +
; crust_hp_per_class × waardeklasse (0 rommel .. 3 kostbaar): 7/9/11/13 slagen = ±4 tot 7 s met het
; houweel, zonder schade. De boor: drill_damage per hap (10 per seconde, dus ±1 s), en per hap
; zoveel gaafheid minder: ±10-18 % voor de hele korst als je voorzichtig boort (tikjes, koel), maal
; drill_hot_factor zolang de boor heter is dan drill_hot_from (deel van de hitte).
; Waarde = basiswaarde × gaafheid, nooit onder de ondergrens.
crust_hp=7.0
crust_hp_per_class=2.0
pickaxe_damage=1.0
drill_damage=1.0
drill_condition_loss=0.014
drill_hot_factor=2.2
drill_hot_from=0.5
min_condition=0.25

; Uiterlijk van de korst (binnen-04): lange vondsten steken met hun uiteinden uit de knol (straal
; langs de lange as = halve lengte × crust_tip_out), en de knol krimpt per slag (tot crust_shrink).
crust_tip_out=0.8
crust_shrink=0.2

; Waardeklassen (bij de basiswaarde, €): gewoon, waardevol, kostbaar. Daaronder rommel.
class_common=50
class_valuable=150
class_precious=300

; Het moment van vrijkomen (gevoel-03), maal de sterkte van de waardeklasse (0,6 .. 1,5): het licht
; (energie, duur in s), de sterretjes (s), de gloed op de vondst (vol, dan uitdoven) en het stof dat
; pas later komt (s).
reveal_light=3.2
reveal_light_s=1.8
reveal_sparkle_s=2.2
reveal_hold_s=0.6
reveal_fade_s=1.8
reveal_dust_delay_s=0.35

; Minimale tijd tussen twee treffers per speler (validatie door de host, in echte tijd).
; Ruim onder het echte tempo (zwaai 0,55 s, boor 0,1 s): speltijd en echte tijd kunnen
; tot 20% verschillen.
pickaxe_min_interval=0.25
drill_min_interval=0.06

; Na het breken van de korst: zoveel ruimte rond de vondst uitgraven, en een sprongetje omhoog
; en naar de speler die hem vrijmaakte (m/s). De eerste free_grace_s seconden kost een klap niets
; (anders kraakte een kristal van zijn eigen sprongetje).
free_margin=0.35
free_impulse=2.0
free_toward=0.6
free_grace_s=1.5

; Rijdt de boorkop van de Mol in een vondst die nog in de rots zit, dan schept hij hem op in het
; laadruim, maar kapot: hij houdt maximaal zoveel gaafheid over (ontwerp-6: de Mol maakt het graven
; niet overbodig; wie een blip ziet, stopt en bikt met de hand).
mol_condition=0.05

; Vondsten en korsten worden enkel getekend tot zoveel meter (er liggen er ±160 op de planeet).
draw_distance=70.0
